<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet.heat demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
    <script type="importmap">
        {"imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js",
            "simpleheat": "https://cdn.jsdelivr.net/npm/simpleheat@1.0.0/simpleheat.js"
        }}
    </script>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
    A 10,000-point demo of <a href="https://github.com/Leaflet/Leaflet.heat">Leaflet.heat</a>, a tiny and fast Leaflet
    heatmap plugin. Other demos: <a href="draw.html">drawing</a>, <a href="v1.html">Leaflet 1.9</a>,
    <a href="global.html">global script</a>.
</p>

<div id="map"></div>

<script type="module">
    import {LeafletMap, TileLayer} from 'leaflet';
    import {HeatLayer} from '../src/HeatLayer.js';

    const map = new LeafletMap('map').setView([-37.87, 175.475], 12);

    new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const points = await (await fetch('points-10000.json')).json();

    new HeatLayer(points).addTo(map);
</script>
</body>
</html>
