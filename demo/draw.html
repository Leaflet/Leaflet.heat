<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet.heat drawing demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css">
    <script type="importmap">
        {"imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js",
            "simpleheat": "https://cdn.jsdelivr.net/npm/simpleheat@1.0.0/simpleheat.js"
        }}
    </script>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
    A dynamic demo of <a href="https://github.com/Leaflet/Leaflet.heat">Leaflet.heat</a>, a tiny and fast Leaflet
    heatmap plugin. Move the pointer over the map to draw. <a href="index.html">Back to the main demo</a>.
</p>

<div id="map"></div>

<script type="module">
    import {LeafletMap, TileLayer} from 'leaflet';
    import {HeatLayer} from '../src/HeatLayer.js';

    const map = new LeafletMap('map').setView([-37.82109, 175.2193], 16);

    new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const points = await (await fetch('points-388.json')).json();
    const heat = new HeatLayer(points).addTo(map);
    let draw = true;

    map.on({
        movestart() { draw = false; },
        moveend() { draw = true; },
        pointermove(e) {
            if (draw) heat.addLatLng(e.latlng);
        }
    });
</script>
</body>
</html>
