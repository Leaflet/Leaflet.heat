<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet.heat global script</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../dist/leaflet-heat-global.js"></script>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
    <a href="https://github.com/Leaflet/Leaflet.heat">Leaflet.heat</a> as a plain script next to Leaflet 1.9, with no
    modules or build step. With Leaflet 2.0, load <code>leaflet-global.js</code> and use
    <code>new L.HeatLayer(...)</code> instead. <a href="index.html">Back to the main demo</a>.
</p>

<div id="map"></div>

<script>
    /* global L */
    const map = L.map('map').setView([-37.87, 175.475], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    fetch('points-10000.json')
        .then(res => res.json())
        .then(points => L.heatLayer(points).addTo(map));
</script>
</body>
</html>
