<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leaflet.heat with Leaflet 1.9</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <!-- 1.9 has no ESM package entry, so map leaflet to its ESM build explicitly -->
    <script type="importmap">
        {"imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet-src.esm.js",
            "simpleheat": "https://cdn.jsdelivr.net/npm/simpleheat@1.0.0/simpleheat.js"
        }}
    </script>
    <link rel="stylesheet" href="demo.css">
</head>
<body>

<p>
    <a href="https://github.com/Leaflet/Leaflet.heat">Leaflet.heat</a> on Leaflet 1.9, loaded as an ES module.
    <a href="index.html">Back to the main demo</a>.
</p>

<div id="map"></div>

<script type="module">
    import * as L from 'leaflet';
    import {HeatLayer} from '../src/HeatLayer.js';

    const map = L.map('map').setView([-37.87, 175.475], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://osm.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const points = await (await fetch('points-10000.json')).json();

    new HeatLayer(points).addTo(map);
</script>
</body>
</html>
